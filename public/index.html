<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PDF를 쉬운 말 해설과 카드뉴스 콘텐츠로 바꾸는 도구" />
  <title>PDF 쉬운 해설 & 카드뉴스 생성기</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div class="pencil-mark" aria-hidden="true">✎</div>
      <p class="eyebrow">PDF · GEMINI · CARD NEWS</p>
      <h1>어려운 PDF를<br /><span>쉽고 재미있게</span> 바꿔요</h1>
      <p class="hero-copy">논문이나 보고서를 올리면 쉬운 말 해설과 SNS 카드뉴스 초안을 만들어 드려요.</p>
    </header>

    <section class="panel settings-panel" aria-labelledby="settings-title">
      <h2 id="settings-title">분석 설정</h2>
      <div class="level-row">
        <div>
          <p class="field-label">설명 수준</p>
          <p id="levelDescription" class="muted">초등학교 저학년 눈높이로 쉽고 짧게 설명해요.</p>
        </div>
        <label class="switch-label"><span>저학년</span><input id="levelToggle" type="checkbox" /><span class="switch" aria-hidden="true"></span><span>고학년</span></label>
      </div>
      <input id="levelSlider" class="level-slider" type="range" min="1" max="2" value="1" aria-label="설명 수준" />
    </section>

    <section class="panel upload-panel" aria-labelledby="upload-title">
      <h2 id="upload-title">PDF 올리기</h2>
      <label id="dropZone" class="drop-zone" for="pdfInput">
        <span class="upload-doodle" aria-hidden="true">▱</span>
        <strong>PDF 파일을 여기에 놓거나 눌러서 선택하세요</strong>
        <span class="muted">PDF 1개 · 최대 4MB</span>
        <input id="pdfInput" type="file" accept="application/pdf,.pdf" hidden />
      </label>
      <p id="fileName" class="file-name" aria-live="polite">아직 선택한 파일이 없어요.</p>
      <button id="analyzeButton" class="primary-button" type="button" disabled>PDF 분석 & 카드뉴스 생성하기</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section id="results" class="results" hidden>
      <div class="result-heading"><h2>분석 결과</h2><button id="downloadAll" class="secondary-button" type="button">카드뉴스 PNG 저장</button></div>
      <article class="result-card explanation-card"><span class="card-label">CARD 1</span><h3>쉬운 말 해설</h3><div id="easyExplanation" class="result-text"></div></article>
      <article class="result-card"><span class="card-label">CARD 2</span><h3>핵심 3줄 요약</h3><ol id="summary" class="summary-list"></ol></article>
      <article class="result-card"><span class="card-label">CARD 3</span><h3>SNS 카드뉴스 1~4</h3><div id="cards" class="cards-grid"></div></article>
    </section>
    <footer>PDF 내용은 분석을 위해 Gemini API로 전송됩니다. API 키는 이 화면에 입력하지 않습니다.</footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
